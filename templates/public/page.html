{% extends "base.html" %}
{% block content %}
<main id="main" tabindex="-1" data-page="{{ page }}"{% if project_slug %} data-slug="{{ project_slug }}"{% endif %}>
  <section class="wrap section" aria-label="Loading">
    <div class="space-y-4" role="status" aria-live="polite">
      <div class="skeleton h-10 w-2/3"></div>
      <div class="skeleton h-5 w-full max-w-xl"></div>
      <div class="skeleton h-5 w-4/5 max-w-lg"></div>
      <div class="skeleton mt-6 h-64 w-full"></div>
    </div>
    <noscript>
      <h1 class="text-3xl font-bold">{{ site.hero_heading }}</h1>
      <p class="lead mt-4">{{ site.hero_statement }}</p>
      <p class="mt-6">This site loads its content with JavaScript. Please enable it, or contact
        {% if profile.email %}<a class="underline" href="mailto:{{ profile.email }}">{{ profile.email }}</a>{% endif %}.</p>
    </noscript>
  </section>
</main>
{% endblock %}
